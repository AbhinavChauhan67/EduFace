<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduFace - Attendance Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .container {
            width: 95%;
            max-width: 1200px;
            margin: 20px auto;
        }
        #video-container {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
        }
        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans min-h-screen p-4 flex flex-col items-center">
    <header class="w-full max-w-4xl flex justify-between items-center py-2 mb-4">
        <div onclick="location.href='/'" class="flex items-center gap-2 text-blue-900 font-bold text-xl cursor-pointer">
            <span class="p-2 bg-blue-100 rounded-lg text-blue-600">📷</span> EduFace
        </div>
        <button id="menu-btn" class="text-gray-600 text-3xl focus:outline-none p-1">☰</button>
    </header>

    <main class="w-full max-w-4xl flex flex-col items-center gap-4">
        <div class="text-center mb-2">
            <h1 class="text-2xl font-bold text-gray-800">Live Scanning Box</h1>
            <p class="text-gray-500 text-sm">Position face clearly into the streaming lens.</p>
        </div>

        <div id="video-container" class="shadow-xl border border-gray-200">
            <!-- HTML5 Video element triggered by Browser Permission -->
            <video id="webcam" autoplay playsinline muted></video>
            <div class="absolute bottom-4 left-1/2 -translate-x-1/2 bg-black/60 text-white text-xs px-4 py-1.5 rounded-full backdrop-blur-sm">
                Scanning Active
            </div>
        </div>
        <div id="status-msg" class="text-sm font-semibold text-blue-600 h-6"></div>
    </main>

    <script>
        const video = document.getElementById('webcam');
        const statusMsg = document.getElementById('status-msg');

        // Request camera permission from the browser
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" } 
                });
                video.srcObject = stream;
                statusMsg.textContent = "Camera connected successfully.";
                statusMsg.className = "text-sm font-semibold text-emerald-600 h-6";
            } catch (err) {
                console.error("Camera Access Error:", err);
                statusMsg.textContent = "Camera permission denied or camera unavailable.";
                statusMsg.className = "text-sm font-semibold text-rose-600 h-6";
                alert("Please grant camera permission in your browser address bar.");
            }
        }

        window.addEventListener('DOMContentLoaded', startCamera);
    </script>
</body>
</html>
